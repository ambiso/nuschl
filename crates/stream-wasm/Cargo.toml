# SPDX-License-Identifier: EUPL-1.2
[package]
name = "nuschl-stream-wasm"
description = "The browser call page's stream worker: call keys and SFrame behind one message interface (docs/video-plan.md §4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
hex = "0.4.3"
nuschl-sframe = { path = "../sframe", version = "0.2.0" }
nuschl-stream = { path = "../stream", version = "0.2.0" }
rand_core = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# The wasm-bindgen CLI must be this exact version (nix/web-client.nix).
wasm-bindgen = "=0.2.130"
